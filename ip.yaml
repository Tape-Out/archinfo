name: archinfo
version: 0.1.0
spec: '0.1'
kind: ip
lang:
- bsv
- bh
identity:
  slug: archinfo-tapeout-bsv
  display_name: Chip identity registers
  summary: Read-only registers giving the JEDEC vendor, SoC ID, revision, hart 
    count and RAM size of the chip.
  category: peripheral
  subcategories:
  - identity
  ip_family: archinfo
  integration_profile:
  - apb4-slave
  maturity: simulated
contract:
  version: 1
  ctrl:
    shape: flat
    aw: 8
    dw: 32
params:
  # JEDEC 厂商号：续码 0x7f 的个数，与最后一个字节去掉校验位的低 7 位。两个都是 0 表示非商用
  bank:
    type: int
    default: 0
    range:
    - 0
    - 127
  maker:
    type: int
    default: 0
    range:
    - 0
    - 126
  # SMCCC SOC_ID 里厂商自定的 SoC 号
  part:
    type: int
    default: 0
    range:
    - 0
    - 65535
  # 调试规范的 IDCODE 只给修订号 4 位，先按那个限，rvdbg 报的与这里是同一个数
  rev:
    type: int
    default: 0
    range:
    - 0
    - 15
  harts:
    type: int
    default: 1
    range:
    - 1
    - 8
  ramBytes:
    type: int
    default: 65536
    range:
    - 0
    - 4294967295
emit:
- kind: bsv
  package: Archinfo
  module: mkArchinfo
  config_type: ArchinfoCfg
  interface: ArchinfoIfc
  ctrl: regs
- kind: verilog-flat
  bus: apb4
deps:
  hwcore: ^0.1
  amba: ^0.1
